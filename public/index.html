<!DOCTYPE html>
<html lang="en">
<head>
    <title>HIMA Jukebox - Welcome</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ctp: {
                            base: '#1e1e2e',
                            mantle: '#181825',
                            crust: '#11111b',
                            text: '#cdd6f4',
                            subtext0: '#a6adc8',
                            surface0: '#313244',
                            surface1: '#45475a',
                            blue: '#89b4fa',
                            mauve: '#cba6f7',
                            red: '#f38ba8',
                            green: '#a6e3a1',
                            lavender: '#b4befe'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .card-glow {
            transition: box-shadow 0.3s ease-in-out, transform 0.2s ease-in-out;
        }
        .card-glow:hover {
            transform: translateY(-5px);
        }
        .host-card:hover {
            box-shadow: 0 0 30px rgba(137, 180, 250, 0.3); /* ctp.blue */
        }
        .client-card:hover {
            box-shadow: 0 0 30px rgba(203, 166, 247, 0.3); /* ctp.mauve */
        }
    </style>
</head>
<body class="bg-ctp-crust text-ctp-text flex flex-col items-center justify-center min-h-screen p-4 selection:bg-ctp-mauve selection:text-ctp-base">

    <div class="text-center mb-12">
        <h1 class="text-5xl font-extrabold text-ctp-lavender mb-3">🎵 HIMA Jukebox</h1>
        <p class="text-lg text-ctp-subtext0">Welcome! Please select your role to continue.</p>
    </div>

    <div class="flex flex-col md:flex-row gap-8 w-full max-w-4xl">

        <!-- Host Card -->
        <a href="/host" class="host-card card-glow group w-full md:w-1/2 bg-ctp-mantle p-8 rounded-2xl border-2 border-ctp-surface0 hover:border-ctp-blue flex flex-col items-center text-center no-underline transition-all duration-300">
            <div class="mb-6">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-20 w-20 text-ctp-blue" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 18V5l12-2v13"></path>
                    <circle cx="6" cy="18" r="3"></circle>
                    <circle cx="18" cy="16" r="3"></circle>
                </svg>
            </div>
            <h2 class="text-2xl font-bold text-ctp-text mb-2">I am the Host</h2>
            <p class="text-ctp-subtext0">Choose this if you are managing the music playback on the main speaker system.</p>
        </a>

        <!-- Client Card -->
        <a href="/client" class="client-card card-glow group w-full md:w-1/2 bg-ctp-mantle p-8 rounded-2xl border-2 border-ctp-surface0 hover:border-ctp-mauve flex flex-col items-center text-center no-underline transition-all duration-300">
            <div class="mb-6">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-20 w-20 text-ctp-mauve" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10 18a8 8 0 1 0 0-16 8 8 0 0 0 0 16z"></path>
                    <path d="M12 12a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"></path>
                </svg>
            </div>
            <h2 class="text-2xl font-bold text-ctp-text mb-2">I am a Client</h2>
            <p class="text-ctp-subtext0">Choose this to request songs from your device and add them to the queue.</p>
        </a>

    </div>

    <footer class="mt-16 text-ctp-surface1 text-sm">
        &copy; 2025 HIMA Jukebox System
    </footer>

</body>
</html>
